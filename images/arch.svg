<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">LivaChat architecture</title>
  <desc id="archDesc">The LivaChat app on iPhone and Android connects over HTTPS and WebSocket to a self-hosted LivaChat server. The server stores media and history locally and calls the AI providers you configure. Hermes or OpenClaw relay agents can connect to the server.</desc>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6f6f"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #e8e8e8; stroke-width: 1.5; }
      .box-strong { fill: #ffffff; stroke: #424242; stroke-width: 1.5; }
      .box-muted { fill: #f7f7f7; stroke: #e8e8e8; stroke-width: 1.5; }
      .box-dashed { fill: #f7f7f7; stroke: #111111; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .boundary { fill: none; stroke: #6f6f6f; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .title { font-size: 17px; font-weight: 600; fill: #111111; }
      .subtitle { font-size: 13px; fill: #6f6f6f; }
      .note { font-size: 12px; fill: #6f6f6f; }
      .arrow { stroke: #6f6f6f; stroke-width: 1.5; fill: none; }
      .arrow-dashed { stroke: #6f6f6f; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Your infrastructure boundary -->
  <rect class="boundary" x="285" y="45" width="250" height="235" rx="6"/>
  <text class="subtitle" x="410" y="32" text-anchor="middle">Your infrastructure</text>

  <!-- App -->
  <rect class="box" x="20" y="105" width="190" height="110" rx="6"/>
  <text class="title" x="115" y="142" text-anchor="middle">LivaChat app</text>
  <text class="subtitle" x="115" y="166" text-anchor="middle">iPhone / Android</text>
  <text class="subtitle" x="115" y="188" text-anchor="middle">Voice · Video · Text</text>
  <text class="note" x="115" y="237" text-anchor="middle">Free download</text>

  <!-- Server -->
  <rect class="box-strong" x="320" y="90" width="180" height="110" rx="6"/>
  <text class="title" x="410" y="127" text-anchor="middle">LivaChat server</text>
  <text class="subtitle" x="410" y="151" text-anchor="middle">Self-hosted</text>
  <text class="subtitle" x="410" y="173" text-anchor="middle">Auth · Sessions</text>

  <!-- Local storage -->
  <rect class="box-muted" x="335" y="220" width="150" height="45" rx="6"/>
  <text class="subtitle" x="410" y="240" text-anchor="middle">Local media &amp; history</text>
  <text class="note" x="410" y="257" text-anchor="middle">on your machine</text>

  <!-- AI providers -->
  <rect class="box" x="590" y="90" width="150" height="110" rx="6"/>
  <text class="title" x="665" y="127" text-anchor="middle">AI providers</text>
  <text class="subtitle" x="665" y="151" text-anchor="middle">LLM · ASR · TTS</text>
  <text class="subtitle" x="665" y="173" text-anchor="middle">You choose</text>

  <!-- Working agents -->
  <rect class="box-dashed" x="590" y="220" width="150" height="45" rx="6"/>
  <text class="subtitle" x="665" y="240" text-anchor="middle">Hermes / OpenClaw</text>
  <text class="note" x="665" y="257" text-anchor="middle">working agents</text>

  <!-- App <-> server -->
  <line class="arrow" x1="212" y1="160" x2="318" y2="160" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text class="note" x="265" y="147" text-anchor="middle">HTTPS / WSS</text>
  <text class="note" x="265" y="181" text-anchor="middle">Opus audio</text>

  <!-- Server <-> AI providers -->
  <line class="arrow" x1="502" y1="145" x2="588" y2="145" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
  <text class="note" x="545" y="132" text-anchor="middle">API keys</text>

  <!-- Server -> storage -->
  <line class="arrow" x1="410" y1="202" x2="410" y2="218" marker-end="url(#arrowhead)"/>

  <!-- Server -> working agents -->
  <line class="arrow-dashed" x1="530" y1="242" x2="588" y2="242" marker-end="url(#arrowhead)"/>
  <text class="note" x="559" y="232" text-anchor="middle">relay</text>
</svg>
